#!/usr/bin/env bash
# =============================================================================
# arch-guardian :: config/guardian.conf
# Arquivo de configuração central. É lido pelo guardian.sh via `source`.
# =============================================================================

# --- Caminhos -----------------------------------------------------------
# Diretório onde fica o log da última atualização (relatório antes/depois).
# Observação: o nome tem espaço de propósito ("update arch"), o script trata
# isso corretamente ao usar aspas em todo lugar que referencia essa variável.
LOG_BASE_DIR="/home/fl4v1c0r3/Documents/Logs/update arch"
LOG_FILE="${LOG_BASE_DIR}/log.txt"

# Diretório de estado (snapshots "antes/depois" usados para montar o relatório).
# Fica no HOME do usuário, não precisa de root para escrever.
STATE_DIR="${HOME}/.local/state/arch-guardian"

# --- Pacotes considerados críticos --------------------------------------
# Qualquer pacote nessa lista que aparecer como "pendente de atualização"
# gera aviso em destaque na tabela do menu.
CRITICAL_PACKAGES=(
    linux linux-lts linux-zen linux-hardened
    systemd systemd-libs
    glibc
    openssl openssh
    sudo
    bash
    pacman
    coreutils
    polkit
    dbus
)

# --- AUR -----------------------------------------------------------------
# auto  -> detecta automaticamente (tenta yay, depois paru)
# yay / paru -> força um helper específico
# none  -> desativa as opções de AUR no menu
AUR_HELPER="auto"

# --- BlackArch -------------------------------------------------------------
# Detecção é automática (checa se o repositório "blackarch" está
# configurado em /etc/pacman.conf). Nada a configurar aqui além de
# garantir que o repositório já esteja instalado no sistema.

# --- Teste de conectividade (ping) ------------------------------------------
# Host usado para checar se a conexão está estável o suficiente pra
# atualizar o sistema. Referência: perfil github.com/flavdotexe.
PING_HOST="duckduckgo.com"

# --- Conferência de mirrors --------------------------------------------------
MIRRORLIST_PATH="/etc/pacman.d/mirrorlist"
MIRROR_CHECK_LIMIT=10

# --- Aparência -------------------------------------------------------------
COLOR_OUTPUT=true

# --- Journal --------------------------------------------------------------
# Prioridade máxima considerada "erro" para o journalctl (padrão syslog: 3=err)
JOURNAL_ERROR_PRIORITY=3

# --- BTRFS ------------------------------------------------------------------
# auto  -> detecta se "/" é btrfs
# true  -> força a checagem mesmo se a detecção falhar
# false -> desativa o módulo btrfs
BTRFS_ENABLED="auto"

# --- Snapper ------------------------------------------------------------------
# O arch-guardian NÃO gerencia o snapper. O snapper continua funcionando do
# jeito que já está configurado no sistema (hooks próprios de pacman,
# timeline, etc). Aqui só usamos o `snapper list` para exibir informação,
# de forma somente leitura.
SNAPPER_CONFIG="root"
